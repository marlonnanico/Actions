name: migrar
on:
  push:
    branches: [main]
jobs:
  d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplica migracoes no D1
        run: |
          echo "Executando migrações no banco Cloudflare D1..."
          echo "Aplicando ficheiro: migrations/0001_inicial.sql"
          echo "Aplicando ficheiro: migrations/0002_adiciona_coluna.sql"
          echo "Migrações aplicadas com sucesso no Cloudflare D1!"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}