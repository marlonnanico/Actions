name: Revisao de codigo com IA

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  revisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Revisa PR com Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "A analisar alteracoes no PR #${PR_NUMBER}..."
          npx --yes @github/copilot-cli review --pr $PR_NUMBER || echo "Comentario de revisao enviado!"